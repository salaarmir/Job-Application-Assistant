<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CV Tailor</title>
  <link rel="stylesheet" href="ui/styles.css"/>
  <script src="ui/app.js"></script>
</head>
<body>

    <button id="menuButton" onclick="toggleMenu()"></button>

    <div id="sidebar">
      <h2>Application Assistant</h2>
      <button>Home</button>
      <button>Tailor CV</button>
      <button>Tailor Cover Letter</button>
      <button>Upload Documents</button>
    </div>

    <div id="overlay" onclick="toggleMenu()"></div>
    
    <h1>Personalised Job Application Assistant</h1>

    <label for="companyName">Company Name</label>
    <input id="companyName" type="text" placeholder="e.g. FDM" />

    <label for="jobDescription">Job Description</label>
    <textarea id="jobDescription" placeholder="Paste the full job description here..."></textarea>

    <label for="userPrompts">Additional Instructions (optional)</label>
    <textarea id="userPrompts" placeholder="e.g. Emphasize teamwork skills, or focus on leadership experience..."></textarea>

    <button onclick="createDocuments()">Generate Documents</button>

    <label for="outputLatexCV">Latex CV</label>
    <div class="container">
      <textarea id="outputLatexCV" placeholder="Generated Latex CV will appear here..." width="500" height="800"></textarea>
      <iframe id="pdfPreviewCV" width="500" height="800">Preview of CV</iframe>
    </div>


    <button onclick="convertToPDF('cv')">Preview PDF</button>
    <button onclick="downloadPDF('cv')">Download PDF</button>

    <label for="outputLatexCoverLetter">Latex Cover Letter</label>
    <div class="container">
      <textarea id="outputLatexCoverLetter" placeholder="Generated Latex Cover Letter will appear here..." width="500" height="800"></textarea>
      <iframe id="pdfPreviewCoverLetter" width="500" height="800">Preview of Cover Letter</iframe>
    </div>

    <button onclick="convertToPDF('cover_letter')">Preview PDF</button>
    <button onclick="downloadPDF('cover_letter')">Download PDF</button>

    <p id="status"></p>

</body>
</html>
